name: Import iOS-owned Mahayana source

on:
  push:
    branches:
      - spec/grok-bot-018-ios-parity-20260922

permissions:
  contents: write

concurrency:
  group: ios-runtime-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-runtime-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Detect existing import
        id: state
        shell: bash
        run: |
          if [[ -f source/packages/IOS_RUNTIME_SOURCE_IMPORT.json ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import pinned Fabushi-owned runtime source
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_SHA=f1033a095bba7cf909fa212a6e8b7f2a099ae821
          git clone --filter=blob:none https://github.com/bhrumom/fabushi.git /tmp/fabushi-source
          git -C /tmp/fabushi-source checkout "$LEGACY_SHA"

          mkdir -p source/packages
          rm -rf source/packages/mahayana-rs source/packages/codex-rs source/packages/mahayana-messaging
          cp -R /tmp/fabushi-source/third_party/mahayana/mahayana-rs source/packages/mahayana-rs
          cp -R /tmp/fabushi-source/third_party/mahayana/codex-rs source/packages/codex-rs
          cp -R /tmp/fabushi-source/native/mahayana-messaging source/packages/mahayana-messaging

          python3 - <<'PY'
          from pathlib import Path
          cargo = Path("source/packages/mahayana-rs/Cargo.toml")
          text = cargo.read_text()
          text = text.replace(
              'fabushi-messaging-core = { path = "../../../native/mahayana-messaging" }',
              'fabushi-messaging-core = { path = "../mahayana-messaging" }',
          )
          cargo.write_text(text)
          PY

          cat > source/packages/IOS_RUNTIME_SOURCE_IMPORT.json <<'JSON'
          {
            "schemaVersion": 1,
            "sourceRepository": "bhrumom/fabushi",
            "sourceCommit": "f1033a095bba7cf909fa212a6e8b7f2a099ae821",
            "imports": [
              "third_party/mahayana/mahayana-rs -> source/packages/mahayana-rs",
              "third_party/mahayana/codex-rs -> source/packages/codex-rs",
              "native/mahayana-messaging -> source/packages/mahayana-messaging"
            ],
            "normalBuildRequiresSourceRepository": false
          }
          JSON

      - name: Commit imported source
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/packages
          git commit -m "vendor: own iOS Mahayana runtime source"
          git push origin "HEAD:${{ github.ref_name }}"
