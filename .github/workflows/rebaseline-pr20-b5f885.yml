name: Complete Desktop PR20 b5f885 rebaseline

on:
  push:
    branches:
      - spec/grok-bot-018-ios-parity-20260922
    paths:
      - .github/workflows/rebaseline-pr20-b5f885.yml
      - scripts/rebaseline-pr20-b5f885.py

permissions:
  contents: write

concurrency:
  group: rebaseline-pr20-b5f885
  cancel-in-progress: false

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/grok-bot-018-ios-parity-20260922
          fetch-depth: 0
      - name: Rebaseline source authority and parity ledger
        run: python3 scripts/rebaseline-pr20-b5f885.py
      - name: Verify generated diff
        run: |
          git diff --check
          git diff --exit-code -- manifests/desktop-pr20 manifests/desktop-pr20-reference-index.json
          git status --short
      - name: Commit durable rebaseline and remove maintenance helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebaseline-pr20-b5f885.yml scripts/rebaseline-pr20-b5f885.py
          git add -A
          git commit -m "docs(parity): complete b5f885 rebaseline"
          git push origin HEAD:spec/grok-bot-018-ios-parity-20260922
