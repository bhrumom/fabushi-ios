name: iOS protected session acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to exercise with the bounded Fabushi CI account.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-protected-session-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  protected-account-ui:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
      FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
      FABUSHI_API_BASE_URL: ${{ secrets.FABUSHI_API_BASE_URL }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Require protected Fabushi CI account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FABUSHI_CI_TEST_USERNAME:-}" ] || [ -z "${FABUSHI_CI_TEST_PASSWORD:-}" ]; then
            echo "FABUSHI_CI_TEST_USERNAME and FABUSHI_CI_TEST_PASSWORD are required." >&2
            exit 2
          fi

      - name: Install simulator build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios-sim

      - name: Select and boot simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Prepare bounded refresh-token-free account session
        shell: bash
        env:
          DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-ios-app
          FABUSHI_CI_ACCOUNT_SESSION_FILE: ${{ runner.temp }}/fabushi-ci/account-session.json
        run: |
          set -euo pipefail
          node .github/scripts/prepare-ios-ci-session.mjs
          test -s "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          test "$(stat -f '%Lp' "$FABUSHI_CI_ACCOUNT_SESSION_FILE")" = "600"
          echo "HOST_CI_SESSION=$FABUSHI_CI_ACCOUNT_SESSION_FILE" >> "$GITHUB_ENV"

      - name: Build iOS-owned Rust runtime for simulator
        run: scripts/build-mahayana-ios.sh iphonesimulator arm64

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build app and UI tests for protected acceptance
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/FabushiProtectedDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Stage bounded session inside Fabushi simulator container
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/FabushiProtectedDerivedData/Build/Products/Debug-iphonesimulator/Fabushi.app"
          test -d "$app"
          xcrun simctl install "$UDID" "$app"
          container="$(xcrun simctl get_app_container "$UDID" com.ombhrum.fabushi data)"
          session_dir="$container/Library/Application Support/FabushiCI"
          session_path="$session_dir/account-session.json"
          mkdir -p "$session_dir"
          chmod 700 "$session_dir"
          cp "$HOST_CI_SESSION" "$session_path"
          chmod 600 "$session_path"
          test -s "$session_path"
          echo "FABUSHI_CI_APP_SESSION_IN_SIMULATOR=$session_path" >> "$GITHUB_ENV"

      - name: Run real protected-session Global Dharma journey
        working-directory: mobile/ios
        shell: bash
        env:
          FABUSHI_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FabushiProtectedSession.xcresult"
          xcodebuild test-without-building \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/FabushiProtectedDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FabushiProtectedSession.xcresult" \
            -only-testing:FabushiUITests/GlobalDharmaJourneyUITests/testGlobalDharmaMarketplaceBotWebMcpCommerceJourney \
            CODE_SIGNING_ALLOWED=NO

      - name: Remove protected session from simulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FABUSHI_CI_APP_SESSION_IN_SIMULATOR:-}" ]; then
            rm -f "$FABUSHI_CI_APP_SESSION_IN_SIMULATOR"
          fi
          rm -f "${HOST_CI_SESSION:-}"

      - name: Upload protected-session evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-ios-protected-session-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/FabushiProtectedSession.xcresult
          if-no-files-found: error
          retention-days: 14
