name: Complete Desktop PR20 61f8518 rebaseline

on:
  push:
    branches:
      - spec/grok-bot-018-ios-parity-20260922
    paths:
      - .github/workflows/rebaseline-pr20-61f8518.yml
      - scripts/rebaseline-pr20-61f8518.py

permissions:
  contents: write

concurrency:
  group: rebaseline-pr20-61f8518
  cancel-in-progress: false

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/grok-bot-018-ios-parity-20260922
          fetch-depth: 0
      - name: Rebaseline exact Desktop source and parity authority
        run: python3 scripts/rebaseline-pr20-61f8518.py
      - name: Verify generated baseline
        run: |
          git diff --check
          python3 scripts/check-desktop-pr20-ios-architecture.py
          git status --short
      - name: Commit durable rebaseline and remove maintenance helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebaseline-pr20-61f8518.yml scripts/rebaseline-pr20-61f8518.py
          git add -A
          git commit -m "docs(parity): rebaseline PR20 at 61f8518"
          git push origin HEAD:spec/grok-bot-018-ios-parity-20260922
