name: Complete Desktop PR20 cf0012e rebaseline
on:
  push:
    branches: [spec/grok-bot-018-ios-parity-20260922]
    paths: [.github/workflows/rebaseline-pr20-cf0012e.yml, scripts/rebaseline-pr20-cf0012e.py]
permissions: {contents: write}
jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: spec/grok-bot-018-ios-parity-20260922, fetch-depth: 0}
      - name: Rebaseline exact Desktop authority
        run: python3 scripts/rebaseline-pr20-cf0012e.py
      - name: Verify generated baseline
        run: |
          git diff --check
          python3 scripts/check-desktop-pr20-ios-architecture.py
      - name: Commit durable rebaseline and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebaseline-pr20-cf0012e.yml scripts/rebaseline-pr20-cf0012e.py
          git add -A
          git commit -m "docs(parity): rebaseline PR20 at cf0012e"
          git push origin HEAD:spec/grok-bot-018-ios-parity-20260922
